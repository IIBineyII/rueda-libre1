<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="reserva" content="width=device-width, initial-scale=1.0">
    <title>reserva</title>
</head>

<body>
    <nav aria-labelledby="seccionreservas">
        <ul>
            <li><a href="/rueda-libre1/index.html"style="font-size: 20px;">Inicio</a></li> 
            <li><a href="/rueda-libre1/paginas/tarifas.html"style="font-size: 20px;">Tarifas y rutas</a></li>
        </ul>
    </nav>

    <section aria-labelledby="icono"  style="display: flex; justify-content: center; align-items: center;">
        <img src="/rueda-libre1/img/images.jpg" alt="icono" width="500" height="350">
    </section>

    <header>
        <h1>Reserva Tu bicicleta</h1>
        <p>Correo electronico:</p><a href="mailto:hola@ruedalibre.example">hola@ruedalibre.example</a>
    </header>
  
    <main>
        <aside aria-labelledby="horario">
            <dl>
                <dt>Lunes a viernes</dt>
                <dd>De 7:00 a.m. a 7:00 p.m.</dd>
                <dt>Sábados, domingos y festivos</dt>
                <dd>De 6:00 a.m. a 2:00 p.m.</dd>
            </dl>
        </aside>
        
        <section aria-labelledby="Formulario de reserva">
            <h2>Formulario de reserva</h2>

            <form action="/rueda-libre1/paginas/reservas.html" method="post" aria-labelledby="titulo-reserva">
                <fieldset>
                    <legend>Tus datos</legend>

                    <p>
                        <label for="nombre">Nombre completo</label><br>
                        <input type="text" id="nombre" autocomplete="name" required>
                    </p>

                    <p>
                        <label for="correo">Correo electrónico</label><br>
                        <input type="email" id="correo" name="correo" autocomplete="email" required>
                    </p>

                    <p>
                        <label for="telefono">Teléfono</label><br>
                        <input type="tel" id="telefono" name="telefono" autocomplete="tel" required> 
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Tu reserva</legend>

                    <p>
                        <label for="tipo">Tipo de bicicleta</label><br>
                        <select name="tipo" id="tipo" required>
                            <option value="">Selecciona una opción</option>
                            <option value="urbana">Urbana</option>
                            <option value="montana">Montaña</option>
                            <option value="electrica">Eléctrica</option>
                        </select>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Confirmación</legend>
                    <p>
                        <label for="comentarios">Comentarios (opcional)</label><br>
                        <textarea name="comentarios" id="comentarios" rows="4"></textarea>
                    </p>

                    <p>
                        <input type="checkbox" id="terminos" name="terminos" required>
                        <label for="terminos">Acepto los términos y condiciones</label>
                    </p>

                    <button type="submit">Enviar reserva</button>
                </fieldset>
                
                
            </form> 
        </section>

    </main>
    

    <footer>
        <p>Rueda libre <a href="mailto:hola@ruedalibre.example">hola@ruedalibre.example</a> 2026</p>
    </footer>
</body>
</html>
